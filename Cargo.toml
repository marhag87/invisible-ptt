[package]
name = "invisible-ptt"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
hidapi = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22" # format-preserving rewrite of config.toml on token refresh
ctrlc = "3"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    # The tray icon, its menu, and the rest of its small world.
    "Win32_UI_Shell",              # Shell_NotifyIconW, ShellExecuteW
    "Win32_Graphics_Gdi",          # WNDCLASSW's HBRUSH
    "Win32_System_LibraryLoader",  # GetModuleHandleW
    "Win32_System_Com",            # an apartment for ShellExecuteW's handlers
    "Win32_System_Registry",       # the start-at-sign-in toggle
    "Win32_System_SystemInformation", # GetLocalTime, for log timestamps
]

[profile.release]
opt-level = 2
strip = true
