name: Build installer
description: >
  Compile installer/invisible-ptt.iss with Inno Setup and return the path to the
  setup exe. Expects target/release/invisible-ptt.exe to exist already.

# Shared by installer.yml (manual) and release.yml (on a version tag) so the
# thing tested by hand and the thing published are built the same way.

outputs:
  path:
    description: Path to the built setup exe, relative to the workspace.
    value: ${{ steps.compile.outputs.path }}
  version:
    description: The version it was built with, from Cargo.toml.
    value: ${{ steps.compile.outputs.version }}

runs:
  using: composite
  steps:
    # The runner image ships an Inno Setup, but not reliably a recent enough
    # one: the script uses ArchitecturesAllowed=x64compatible, which needs 6.3.
    # Chocolatey is preinstalled and gives us the current release.
    - name: Install Inno Setup
      shell: pwsh
      run: choco install innosetup --no-progress -y

    - name: Compile
      id: compile
      shell: pwsh
      run: |
        $iscc = @(
          "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
          "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
        ) | Where-Object { Test-Path $_ } | Select-Object -First 1
        if (-not $iscc) {
          Write-Error "Inno Setup compiler not found after install"
          exit 1
        }

        # Single source of truth for the version. The .iss only has a fallback.
        $meta = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
        $version = $meta.packages[0].version
        Write-Host "Building installer for $version with $iscc"

        & $iscc "/DAppVersion=$version" installer\invisible-ptt.iss
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        $path = "dist\invisible-ptt-$version-setup.exe"
        if (-not (Test-Path $path)) {
          Write-Error "Expected $path, which Inno Setup did not produce"
          exit 1
        }
        "path=$path"       | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
        "version=$version" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
