name: CI

# Format, lint, and test on every push and pull request.
#
# Windows is what ships (release.yml builds there too). Linux is checked as
# well because platform.rs is deliberately cfg-gated so the HID++ half builds
# and smoke-tests on a Linux live image - that is how the protocol work gets
# verified against real hardware, and it is only true for as long as something
# keeps building it.
on:
  push:
  pull_request:

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # hidapi builds against libudev on Linux (hidraw backend).
      - name: Install Linux HID dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked
